[project]
name = "transcriber"
version = "0.1.0"
description = "Local voice dictation for Windows: global hotkey, Faster-Whisper, Ollama refinement, paste at the cursor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2.0",
  # ctranslate2 links against cuBLAS and cuDNN 9 for CUDA 12 but does not bundle them.
  # torch used to supply these DLLs as a side effect; these wheels do it directly and
  # cost about a quarter of what the torch stack did.
  "nvidia-cublas-cu12>=12.4",
  "nvidia-cudnn-cu12>=9,<10",
  "sounddevice>=0.4.6",
  "numpy>=1.24.0",
  "pynput>=1.8.0",
  "PySide6>=6.7.0",
  "requests>=2.31.0",
  "loguru>=0.7.0",
]

[project.scripts]
transcriber = "app.main:main"

[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
